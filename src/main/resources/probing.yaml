openapi: 3.0.3
info:
  title: "Probing service API specifications"
  version: 1.1.0
  x-summary: "Monitoring the E-Services status"
  description: >-
    OpenAPI specification for state control of Public Administration e-services
  contact:
    name: API Support
    url: "https://www.example.com/support"
    email: support@example.com
  termsOfService: "https://swagger.io/terms/"
tags:
  - name: InteropProbing
    description: "Read data operations."

paths:
  "/interop/probing/{mode}/status":
    get:
      summary: "Provides the status of the E-Service (OK, Error, Random)"
      tags:
        - InteropProbing
      operationId: getEserviceStatus
      parameters:
        - name: mode
          in: path
          description: "Mode of the response. Can be 'ok', 'error', or 'random'."
          required: true
          schema:
            type: string
            enum: [ok, error, random]
        - name: Authorization
          in: header
          description: "JWT Bearer token"
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "The e-service is up and running"
        "400":
          description: "Bad request"
        "500":
          description: "A managed error has occurred during the request elaboration"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example:
                type: "about:blank"
                status: 500
                title: "Internal Server Error"
                detail: "There is a problem processing the request on the server."
                traceId: "string"
                errors:
                  [
                    {
                      "code": "000-1234",
                      "detail": "The server is currently down for maintenance. Please try again later.",
                    },
                  ]

components:
  schemas:
    Problem:
      type: object
      properties:
        type:
          description: "URI reference of type definition"
          type: string
        status:
          description: "The HTTP status code generated by the origin server for this occurrence of the problem."
          example: 500
          minimum: 100
          maximum: 600
          type: integer
        title:
          description: "A short summary of the problem type."
          example: "Internal Server Error"
          maxLength: 64
          pattern: "^[ -~]{0,64}$"
          type: string
        detail:
          description: "A human readable explanation of the problem."
          example: "Internal Server Error"
          maxLength: 4096
          pattern: "^.{0,1024}$"
          type: string
        traceId:
          type: string
          nullable: false
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ProblemError"
      additionalProperties: false
      required:
        - status
        - title

    ProblemError:
      type: object
      properties:
        code:
          description: "Internal code of the error"
          example: "123-4567"
          minLength: 8
          maxLength: 8
          pattern: "^[0-9]{3}-[0-9]{4}$"
          type: string
        detail:
          description: "A human readable explanation specific to this occurrence of the problem."
          example: "Parameter not valid"
          maxLength: 4096
          pattern: "^.{0,1024}$"
          type: string
      required:
        - code
        - detail
